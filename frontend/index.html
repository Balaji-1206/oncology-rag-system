<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedGPT Oncology Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    /* Calmer, more clinical palette */
    --bg:#070a14;
    --bg-2:#0a0f1d;
    --panel:rgba(14,20,36,0.72);
    --panel-strong:rgba(16,22,40,0.88);
    --glass:rgba(255,255,255,0.05);
    --glass-2:rgba(255,255,255,0.08);
    --line:rgba(255,255,255,0.08);
    --line-strong:rgba(120,160,230,0.22);
    --text:#f0f4fa;
    --text-2:#e1e8f3;
    --muted:#8a9bb8;
    --muted-2:#6b7d99;
    --soft:#cfdcef;

    /* Refined medical palette - calmer blues, less neon */
    --primary:#4a90e2;
    --primary-2:#5fa3f0;
    --accent:#6ec5e0;
    --teal:#4dd4c4;
    --violet:#8b7dd8;
    --green:#4ade80;
    --warn:#f5b942;
    --danger:#e85d75;
    --rose:#c97494;

    --sidebar:300px;
    --shadow-sm:0 4px 12px rgba(0,0,0,0.20);
    --shadow:0 12px 36px rgba(0,0,0,0.32);

    --glow-x:50%;
    --glow-y:30%;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    color-scheme:dark;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    color:var(--text);
    background:
        radial-gradient(ellipse at var(--glow-x) var(--glow-y), rgba(74,144,226,0.10), transparent 40vw),
        linear-gradient(160deg, #060912 0%, #0a1226 45%, #0d1428 75%, #060912 100%);
    letter-spacing:-0.005em;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.08));
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
}

button:disabled,
input:disabled{
    cursor:not-allowed;
}

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:rgba(120,140,180,0.20);
    border:2px solid transparent;
    border-radius:999px;
    background-clip:content-box;
    transition:background 0.2s;
}

::-webkit-scrollbar-thumb:hover{
    background:rgba(120,140,180,0.35);
    background-clip:content-box;
}

.app{
    position:relative;
    z-index:1;
    display:flex;
    height:100vh;
    width:100%;
}

/* Reduced ambient layer - just one soft gradient */
.ambient{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.ambient-glow{
    position:absolute;
    top:-20%;
    left:30%;
    width:60%;
    height:80%;
    background:radial-gradient(ellipse, rgba(74,144,226,0.10), transparent 60%);
    filter:blur(50px);
    opacity:0.7;
}

.ambient-glow-2{
    position:absolute;
    bottom:-30%;
    right:-10%;
    width:50%;
    height:70%;
    background:radial-gradient(ellipse, rgba(139,125,216,0.08), transparent 60%);
    filter:blur(60px);
    opacity:0.6;
}

/* Sidebar - cleaner, more professional */
.sidebar{
    position:relative;
    width:var(--sidebar);
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:18px;
    background:linear-gradient(180deg, rgba(10,15,28,0.94), rgba(8,12,22,0.86));
    border-right:1px solid var(--line);
    backdrop-filter:blur(16px);
    transition:transform 0.3s cubic-bezier(.2,.85,.2,1);
    z-index:5;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 6px 22px;
}

.brand-mark{
    position:relative;
    width:44px;
    height:44px;
    border-radius:13px;
    background:linear-gradient(135deg, var(--primary), var(--violet));
    box-shadow:0 6px 20px rgba(74,144,226,0.30);
    display:grid;
    place-items:center;
}

.brand-mark::before{
    content:"";
    width:18px;
    height:18px;
    border-radius:50%;
    border:2px solid white;
}

.brand-mark::after{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    background:white;
    border-radius:50%;
}

.brand-name h2{
    font-size:18px;
    font-weight:700;
    line-height:1.1;
    color:var(--text);
    letter-spacing:-0.01em;
}

.brand-name span{
    color:var(--muted);
    font-size:10.5px;
    font-weight:500;
    letter-spacing:0.6px;
    text-transform:uppercase;
}

.new-chat{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    min-height:44px;
    margin-bottom:16px;
    color:white;
    cursor:pointer;
    border-radius:12px;
    background:linear-gradient(135deg, var(--primary), #5a7fd0);
    box-shadow:0 4px 14px rgba(74,144,226,0.25);
    font-weight:600;
    font-size:13.5px;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
}

.new-chat:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 20px rgba(74,144,226,0.35);
}

.new-chat:active{
    transform:translateY(0);
}

.new-chat svg{
    width:16px;
    height:16px;
}

.sidebar-search{
    position:relative;
    margin-bottom:14px;
}

.sidebar-search input{
    width:100%;
    height:36px;
    padding:0 12px 0 34px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.035);
    color:white;
    font-size:12.5px;
    outline:none;
    transition:border-color 0.2s ease, background 0.2s ease;
}

.sidebar-search input::placeholder{
    color:var(--muted-2);
}

.sidebar-search input:focus{
    border-color:rgba(74,144,226,0.4);
    background:rgba(74,144,226,0.05);
}

.sidebar-search svg{
    position:absolute;
    left:11px;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    color:var(--muted-2);
    pointer-events:none;
}

.sidebar-section{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:4px 4px 10px;
    color:var(--muted);
    font-size:10.5px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.chat-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:20px;
    height:18px;
    padding:0 6px;
    border-radius:999px;
    color:var(--accent);
    font-size:10.5px;
    background:rgba(110,197,224,0.10);
    border:1px solid rgba(110,197,224,0.18);
}

.chat-history{
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow-y:auto;
    padding:2px 3px 8px 0;
    flex:1;
    min-height:0;
}

.history-item{
    position:relative;
    padding:11px 36px 11px 36px;
    min-height:46px;
    border-radius:10px;
    color:var(--text-2);
    cursor:pointer;
    line-height:1.4;
    font-size:12.5px;
    background:rgba(255,255,255,0.025);
    border:1px solid rgba(255,255,255,0.05);
    transition:background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    display:-webkit-box;
    line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    word-break:break-word;
}

.history-item::before{
    content:"";
    position:absolute;
    left:13px;
    top:16px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--primary), var(--accent));
    opacity:0.7;
}

.history-item:hover,
.history-item.active{
    background:rgba(74,144,226,0.08);
    border-color:rgba(74,144,226,0.25);
    transform:translateX(2px);
}

.history-item.active::before{
    background:linear-gradient(135deg, var(--teal), var(--accent));
    opacity:1;
}

.history-delete{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:22px;
    height:22px;
    border-radius:6px;
    background:rgba(232,93,117,0.10);
    color:var(--danger);
    cursor:pointer;
    opacity:0;
    transition:opacity 0.2s ease, background 0.2s ease;
    display:grid;
    place-items:center;
}

.history-item:hover .history-delete{
    opacity:1;
}

.history-delete:hover{
    background:rgba(232,93,117,0.22);
}

.history-empty{
    padding:18px 14px;
    color:var(--muted);
    border:1px dashed rgba(255,255,255,0.10);
    border-radius:12px;
    background:rgba(255,255,255,0.015);
    line-height:1.6;
    font-size:12.5px;
    text-align:center;
}

.history-empty svg{
    width:24px;
    height:24px;
    margin-bottom:6px;
    color:rgba(110,197,224,0.35);
}

.sidebar-footer{
    margin-top:12px;
    padding-top:12px;
}

.status-card{
    padding:12px;
    border-radius:12px;
    background:rgba(255,255,255,0.025);
    border:1px solid rgba(255,255,255,0.07);
}

.status-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    color:var(--muted);
    font-size:11.5px;
    margin-bottom:6px;
}

.status-row:last-child{
    margin-bottom:0;
}

.status-row strong{
    color:var(--soft);
    font-weight:600;
}

.status-light{
    display:inline-flex;
    align-items:center;
    gap:7px;
}

.status-light::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px rgba(74,222,128,0.55);
    animation:livePulse 2s ease-in-out infinite;
}

.feature-toggles{
    display:grid;
    gap:9px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,0.07);
}

.feature-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-height:36px;
    color:var(--soft);
    font-size:11.5px;
    font-weight:600;
}

.switch{
    position:relative;
    display:inline-flex;
    width:44px;
    height:24px;
    flex:0 0 auto;
}

.switch input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.switch-slider{
    position:absolute;
    inset:0;
    cursor:pointer;
    border-radius:999px;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.10);
    transition:background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.switch-slider::before{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    left:2px;
    top:2px;
    border-radius:50%;
    background:#d7e4f6;
    box-shadow:0 2px 8px rgba(0,0,0,0.30);
    transition:transform 0.22s cubic-bezier(.2,.85,.2,1), background 0.2s ease;
}

.switch input:checked + .switch-slider{
    background:rgba(77,212,196,0.24);
    border-color:rgba(77,212,196,0.50);
    box-shadow:0 0 16px rgba(77,212,196,0.12);
}

.switch input:checked + .switch-slider::before{
    transform:translateX(20px);
    background:#ffffff;
}

.switch input:disabled + .switch-slider{
    cursor:not-allowed;
    opacity:0.55;
}

/* Main layout */
.main{
    position:relative;
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.topbar{
    position:relative;
    z-index:5;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    background:linear-gradient(180deg, rgba(8,12,22,0.88), rgba(8,12,22,0.62));
    backdrop-filter:blur(16px);
}

.menu-toggle{
    display:none;
    width:38px;
    height:38px;
    border-radius:10px;
    color:white;
    cursor:pointer;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    transition:background 0.2s, border-color 0.2s;
}

.menu-toggle:hover{
    background:rgba(74,144,226,0.08);
    border-color:rgba(74,144,226,0.25);
}

.top-title{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.topbar h1{
    font-size:16px;
    font-weight:700;
    line-height:1.1;
    display:flex;
    align-items:center;
    gap:8px;
    letter-spacing:-0.01em;
}

.live-dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px rgba(74,222,128,0.55);
    animation:livePulse 2s ease-in-out infinite;
}

.topbar p{
    color:var(--muted);
    font-size:11.5px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.action-btn{
    width:34px;
    height:34px;
    border-radius:9px;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.07);
    color:#a8b6cf;
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.action-btn:hover{
    background:rgba(74,144,226,0.08);
    border-color:rgba(74,144,226,0.25);
    color:var(--accent);
}

.action-btn svg{
    width:15px;
    height:15px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    height:32px;
    padding:0 12px;
    border-radius:999px;
    color:var(--text-2);
    font-size:11.5px;
    font-weight:600;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.08);
}

.badge::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px rgba(74,222,128,0.55);
}

.chat-area{
    flex:1;
    overflow-y:auto;
    scroll-behavior:smooth;
    padding:28px 24px 140px;
}

.chat-wrapper{
    width:100%;
    max-width:920px;
    margin:0 auto;
}

/* Hero - tighter, more focused */
.hero{
    min-height:auto;
    padding:8px 0 28px;
    animation:fadeIn 0.5s ease both;
}

.hero-shell{
    position:relative;
    padding:28px;
    border-radius:24px;
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:var(--shadow);
}

.hero-grid{
    position:relative;
    display:grid;
    grid-template-columns:1.2fr 0.8fr;
    gap:24px;
    align-items:center;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    width:max-content;
    margin-bottom:14px;
    padding:6px 11px;
    border-radius:999px;
    color:var(--soft);
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.9px;
    background:rgba(110,197,224,0.07);
    border:1px solid rgba(110,197,224,0.18);
}

.eyebrow::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px rgba(110,197,224,0.6);
}

.hero h2{
    max-width:600px;
    font-size:clamp(26px, 3.4vw, 42px);
    line-height:1.08;
    font-weight:700;
    letter-spacing:-0.025em;
    color:var(--text);
}

.hero h2 span{
    background:linear-gradient(90deg, var(--accent), var(--primary-2), var(--violet));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero-copy{
    max-width:560px;
    margin-top:12px;
    color:var(--muted);
    font-size:14px;
    line-height:1.65;
}

.hero-stats{
    display:flex;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
}

.hero-stat{
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px 10px;
    border-radius:8px;
    background:rgba(255,255,255,0.025);
    border:1px solid rgba(255,255,255,0.06);
    font-size:11.5px;
    color:var(--muted);
}

.hero-stat strong{
    color:var(--accent);
    font-weight:600;
}

.hero-stat svg{
    width:13px;
    height:13px;
    color:var(--accent);
}

.prompt-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-top:20px;
}

.prompt-card{
    position:relative;
    padding:14px;
    border-radius:13px;
    cursor:pointer;
    color:var(--text-2);
    text-align:left;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.07);
    transition:background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    overflow:hidden;
}

.prompt-card:hover{
    transform:translateY(-2px);
    border-color:rgba(110,197,224,0.30);
    background:rgba(110,197,224,0.05);
}

.prompt-card-icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    border-radius:8px;
    background:rgba(110,197,224,0.12);
    margin-bottom:8px;
    color:var(--accent);
}

.prompt-card-icon svg{
    width:14px;
    height:14px;
}

.prompt-card strong{
    display:block;
    margin-bottom:3px;
    font-size:13px;
    font-weight:600;
    color:var(--text);
}

.prompt-card span{
    color:var(--muted);
    font-size:11.5px;
    line-height:1.45;
    display:block;
}

.prompt-card-arrow{
    position:absolute;
    top:14px;
    right:14px;
    width:20px;
    height:20px;
    border-radius:6px;
    background:rgba(255,255,255,0.04);
    display:grid;
    place-items:center;
    opacity:0;
    transform:translateX(-4px);
    transition:opacity 0.2s ease, transform 0.2s ease;
}

.prompt-card:hover .prompt-card-arrow{
    opacity:1;
    transform:translateX(0);
}

.prompt-card-arrow svg{
    width:11px;
    height:11px;
    color:var(--accent);
}

.insight-panel{
    display:grid;
    gap:10px;
    padding:16px;
    border-radius:18px;
    background:rgba(10,16,30,0.55);
    border:1px solid rgba(255,255,255,0.07);
}

.metric-card{
    padding:14px;
    border-radius:12px;
    background:rgba(255,255,255,0.025);
    border:1px solid rgba(255,255,255,0.05);
}

.metric-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    color:var(--muted);
    font-size:10.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.8px;
}

.metric-value{
    margin-top:6px;
    font-size:20px;
    font-weight:700;
    color:var(--text);
    letter-spacing:-0.01em;
}

.sparkline{
    height:4px;
    margin-top:10px;
    border-radius:999px;
    background:linear-gradient(90deg, var(--accent), var(--primary), var(--violet));
    opacity:0.7;
}

/* Messages - improved readability */
.message-row{
    display:flex;
    gap:14px;
    padding:10px 0;
    animation:messageReveal 0.4s ease both;
}

.message-row.user{
    justify-content:flex-end;
}

.message-row.ai{
    justify-content:flex-start;
}

.avatar{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:11px;
    display:grid;
    place-items:center;
    font-weight:700;
    font-size:12.5px;
    color:white;
    background:linear-gradient(135deg, var(--primary), var(--violet));
    box-shadow:0 4px 14px rgba(74,144,226,0.22);
}

.message-row.user .avatar{
    order:2;
    background:linear-gradient(135deg, rgba(255,255,255,0.14), rgba(74,144,226,0.30));
}

.message-content{
    position:relative;
    width:min(100%, 760px);
    padding:20px 22px;
    border-radius:18px;
    background:rgba(14,20,36,0.62);
    border:1px solid rgba(255,255,255,0.07);
    box-shadow:var(--shadow-sm);
}

.message-row.user .message-content{
    width:auto;
    max-width:min(640px, 78%);
    color:white;
    background:linear-gradient(135deg, rgba(74,144,226,0.18), rgba(139,125,216,0.12));
    border-color:rgba(120,160,230,0.22);
}

.message-title{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:14px;
    color:var(--soft);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.1px;
}

.title-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:2px 7px;
    border-radius:5px;
    background:rgba(110,197,224,0.10);
    border:1px solid rgba(110,197,224,0.22);
    color:var(--accent);
    font-size:9.5px;
    letter-spacing:0.6px;
}

.title-badge::before{
    content:"";
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--accent);
}

/* Answer typography - medical report style */
.answer-text,
.reasoning-text{
    color:var(--text);
    font-size:14.5px;
    line-height:1.72;
}

.answer-text p,
.reasoning-text p{
    margin-bottom:11px;
}

.answer-text p:last-child,
.reasoning-text p:last-child{
    margin-bottom:0;
}

.answer-text ul,
.reasoning-text ul{
    margin:8px 0 12px 0;
    padding-left:0;
    list-style:none;
}

.answer-text li,
.reasoning-text li{
    position:relative;
    padding:4px 0 4px 20px;
    margin:2px 0;
    line-height:1.65;
}

.answer-text li::before,
.reasoning-text li::before{
    content:"";
    position:absolute;
    left:4px;
    top:13px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    opacity:0.6;
}

.answer-text strong,
.reasoning-text strong{
    color:#ffffff;
    font-weight:600;
}

.answer-text h1,
.answer-text h2,
.answer-text h3,
.reasoning-text h1,
.reasoning-text h2,
.reasoning-text h3{
    margin:14px 0 8px;
    font-weight:700;
    color:var(--text);
    letter-spacing:-0.01em;
}

.answer-text code,
.reasoning-text code{
    background:rgba(110,197,224,0.08);
    padding:1px 6px;
    border-radius:5px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.88em;
    color:var(--accent);
    border:1px solid rgba(110,197,224,0.15);
}

/* Medical term highlight */
.med-term{
    color:var(--accent);
    font-weight:600;
    border-bottom:1px dotted rgba(110,197,224,0.4);
    cursor:help;
}

/* Section divider */
.answer-divider{
    height:1px;
    margin:14px 0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
}

/* Message actions */
.message-actions{
    display:flex;
    gap:6px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,0.06);
    flex-wrap:wrap;
}

.msg-action{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 9px;
    border-radius:7px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.07);
    color:var(--muted);
    font-size:11.5px;
    cursor:pointer;
    transition:background 0.2s, color 0.2s, border-color 0.2s;
}

.msg-action:hover{
    background:rgba(110,197,224,0.07);
    color:var(--accent);
    border-color:rgba(110,197,224,0.25);
}

.msg-action.copied{
    background:rgba(74,222,128,0.08);
    color:var(--green);
    border-color:rgba(74,222,128,0.25);
}

.msg-action svg{
    width:12px;
    height:12px;
}

.typing-caret::after{
    content:"";
    display:inline-block;
    width:2px;
    height:14px;
    margin-left:3px;
    vertical-align:-2px;
    background:var(--accent);
    animation:caretBlink 1s steps(1) infinite;
}

/* Reasoning - collapsible accordion */
.reasoning-box{
    margin-top:14px;
    opacity:0;
    transform:translateY(8px);
    max-height:0;
    overflow:hidden;
    transition:opacity 0.35s ease, transform 0.35s ease, max-height 0.45s ease;
}

.reasoning-box.show{
    opacity:1;
    transform:translateY(0);
    max-height:1600px;
}

.reasoning-toggle{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px 14px;
    border-radius:11px;
    background:rgba(139,125,216,0.06);
    border:1px solid rgba(139,125,216,0.18);
    color:var(--text-2);
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    text-align:left;
    transition:background 0.2s ease, border-color 0.2s ease;
}

.reasoning-toggle:hover{
    background:rgba(139,125,216,0.10);
    border-color:rgba(139,125,216,0.30);
}

.reasoning-toggle-left{
    display:flex;
    align-items:center;
    gap:9px;
}

.reasoning-toggle-icon{
    width:22px;
    height:22px;
    border-radius:6px;
    background:rgba(139,125,216,0.15);
    color:var(--violet);
    display:grid;
    place-items:center;
}

.reasoning-toggle-icon svg{
    width:12px;
    height:12px;
}

.reasoning-toggle-label{
    display:flex;
    flex-direction:column;
    gap:1px;
}

.reasoning-toggle-label strong{
    font-size:12px;
    font-weight:600;
    color:var(--text);
    letter-spacing:0.2px;
}

.reasoning-toggle-label span{
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.8px;
    font-weight:500;
}

.reasoning-chevron{
    display:inline-flex;
    color:var(--muted);
    transition:transform 0.3s ease;
}

.reasoning-chevron svg{
    width:14px;
    height:14px;
}

.reasoning-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows 0.35s ease;
}

.reasoning-body.open{
    grid-template-rows:1fr;
    margin-top:8px;
}

.reasoning-body-inner{
    overflow:hidden;
}

.reasoning-inner{
    padding:16px 18px;
    border-radius:13px;
    background:linear-gradient(180deg, rgba(139,125,216,0.05), rgba(139,125,216,0.02));
    border:1px solid rgba(139,125,216,0.14);
    border-left:3px solid var(--violet);
}

.reasoning-inner .reasoning-text{
    color:var(--text-2);
    font-size:13.5px;
    line-height:1.7;
}

/* Bottom section */
.bottom-section{
    margin-top:14px;
    opacity:0;
    transform:translateY(8px);
    max-height:0;
    overflow:hidden;
    transition:opacity 0.35s ease, transform 0.35s ease, max-height 0.45s ease;
}

.bottom-section.show{
    opacity:1;
    transform:translateY(0);
    max-height:2000px;
}

.bottom-grid{
    display:grid;
    grid-template-columns:240px 1fr;
    gap:12px;
    align-items:start;
}

/* Radial confidence gauge */
.confidence-box{
    padding:16px;
    border-radius:14px;
    background:rgba(255,255,255,0.025);
    border:1px solid rgba(255,255,255,0.07);
    display:flex;
    flex-direction:column;
    align-items:center;
}

.confidence-header{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:10px;
    color:var(--soft);
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    align-self:flex-start;
}

.confidence-header svg{
    width:12px;
    height:12px;
    color:var(--accent);
}

.gauge-wrap{
    position:relative;
    width:130px;
    height:130px;
    margin:4px 0 8px;
}

.gauge-svg{
    width:100%;
    height:100%;
    transform:rotate(-90deg);
}

.gauge-track{
    fill:none;
    stroke:rgba(255,255,255,0.06);
    stroke-width:8;
}

.gauge-fill{
    fill:none;
    stroke-width:8;
    stroke-linecap:round;
    transition:stroke-dashoffset 1.4s cubic-bezier(.22,.85,.32,1);
}

.gauge-fill.high{
    stroke:url(#gaugeGradHigh);
}

.gauge-fill.med{
    stroke:url(#gaugeGradMed);
}

.gauge-fill.low{
    stroke:url(#gaugeGradLow);
}

.gauge-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.gauge-value{
    font-family:'JetBrains Mono', monospace;
    font-size:24px;
    font-weight:600;
    letter-spacing:-0.02em;
    line-height:1;
}

.gauge-value.high{ color:var(--green); }
.gauge-value.med{ color:var(--warn); }
.gauge-value.low{ color:var(--danger); }

.gauge-label{
    margin-top:4px;
    font-size:9.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.8px;
    font-weight:600;
}

.confidence-tier{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 9px;
    border-radius:999px;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.3px;
    margin-top:2px;
}

.confidence-tier.high{
    background:rgba(74,222,128,0.10);
    color:var(--green);
    border:1px solid rgba(74,222,128,0.25);
}

.confidence-tier.med{
    background:rgba(245,185,66,0.10);
    color:var(--warn);
    border:1px solid rgba(245,185,66,0.25);
}

.confidence-tier.low{
    background:rgba(232,93,117,0.10);
    color:var(--danger);
    border:1px solid rgba(232,93,117,0.25);
}

.confidence-note{
    margin-top:10px;
    font-size:11px;
    line-height:1.5;
    color:var(--muted);
    text-align:center;
}

/* Sources - research grade */
.sources-shell{
    padding:16px;
    border-radius:14px;
    background:rgba(255,255,255,0.025);
    border:1px solid rgba(255,255,255,0.07);
}

.sources-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    min-height:38px;
    padding:0 12px;
    border-radius:10px;
    cursor:pointer;
    color:var(--text-2);
    font-size:12.5px;
    font-weight:600;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    transition:background 0.2s ease, border-color 0.2s ease;
}

.sources-btn:hover{
    border-color:rgba(110,197,224,0.25);
    background:rgba(110,197,224,0.06);
}

.src-label{
    display:flex;
    align-items:center;
    gap:7px;
}

.src-label svg{
    width:13px;
    height:13px;
    color:var(--accent);
}

.src-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:18px;
    height:18px;
    padding:0 5px;
    border-radius:5px;
    background:rgba(110,197,224,0.14);
    color:var(--accent);
    font-size:10.5px;
    font-weight:700;
    font-family:'JetBrains Mono', monospace;
}

.source-chevron{
    display:inline-flex;
    color:var(--muted);
    transition:transform 0.3s ease;
}

.source-chevron svg{
    width:13px;
    height:13px;
}

.sources-container{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows 0.35s ease;
}

.sources-container.open{
    grid-template-rows:1fr;
    margin-top:10px;
}

.sources-list{
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.source-card{
    padding:13px 14px;
    border-radius:11px;
    background:rgba(255,255,255,0.025);
    border:1px solid rgba(255,255,255,0.07);
    transition:border-color 0.2s ease, background 0.2s ease;
    position:relative;
}

.source-card:hover{
    border-color:rgba(110,197,224,0.22);
    background:rgba(110,197,224,0.03);
}

.source-card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
}

.source-rank{
    display:inline-flex;
    align-items:center;
    gap:6px;
}

.rank-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:22px;
    height:22px;
    padding:0 7px;
    border-radius:6px;
    background:linear-gradient(135deg, var(--primary), var(--violet));
    color:white;
    font-size:10px;
    font-weight:700;
    font-family:'JetBrains Mono', monospace;
    box-shadow:0 2px 6px rgba(74,144,226,0.22);
}

.source-title{
    color:var(--text-2);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.3px;
    text-transform:uppercase;
}

.evidence-chips{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.evidence-chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:2px 7px;
    border-radius:999px;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.3px;
    text-transform:uppercase;
}

.evidence-chip.relevance{
    background:rgba(110,197,224,0.10);
    color:var(--accent);
    border:1px solid rgba(110,197,224,0.22);
}

.evidence-chip.evidence{
    background:rgba(77,212,196,0.09);
    color:var(--teal);
    border:1px solid rgba(77,212,196,0.22);
}

.evidence-chip svg{
    width:9px;
    height:9px;
}

.source-text{
    color:var(--soft);
    line-height:1.6;
    font-size:12.5px;
}

/* Thinking state */
.thinking-card{
    display:flex;
    align-items:center;
    gap:11px;
    color:var(--text-2);
    font-size:13px;
}

.thinking-dots{
    display:inline-flex;
    gap:5px;
}

.thinking-dots span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--accent);
    animation:dotPulse 1.1s ease-in-out infinite;
}

.thinking-dots span:nth-child(2){ animation-delay:0.15s; }
.thinking-dots span:nth-child(3){ animation-delay:0.3s; }

.thinking-status{
    display:flex;
    flex-direction:column;
    gap:5px;
    margin-top:14px;
}

.thinking-step{
    display:flex;
    align-items:center;
    gap:9px;
    padding:7px 11px;
    border-radius:8px;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.05);
    font-size:11.5px;
    color:var(--muted);
    opacity:0;
    transform:translateX(-8px);
    animation:stepEnter 0.35s ease forwards;
}

.thinking-step:nth-child(1){ animation-delay:0.05s; }
.thinking-step:nth-child(2){ animation-delay:0.35s; }
.thinking-step:nth-child(3){ animation-delay:0.7s; }
.thinking-step:nth-child(4){ animation-delay:1.05s; }

.thinking-step.active{
    background:rgba(110,197,224,0.06);
    border-color:rgba(110,197,224,0.20);
    color:var(--text-2);
}

.thinking-step.done{
    color:var(--green);
    background:rgba(74,222,128,0.04);
    border-color:rgba(74,222,128,0.15);
}

.thinking-step .step-icon{
    width:14px;
    height:14px;
    border-radius:50%;
    border:1.5px solid currentColor;
    flex-shrink:0;
    position:relative;
}

.thinking-step.active .step-icon::after{
    content:"";
    position:absolute;
    inset:2px;
    border-radius:50%;
    background:var(--accent);
}

.thinking-step.done .step-icon{
    background:var(--green);
    border-color:var(--green);
}

.thinking-step.done .step-icon::after{
    content:"";
    position:absolute;
    left:2.5px;
    top:0.5px;
    width:4px;
    height:7px;
    border:solid #0a1226;
    border-width:0 1.5px 1.5px 0;
    transform:rotate(45deg);
}

.skeleton-lines{
    display:grid;
    gap:7px;
    margin-top:12px;
}

.skeleton-lines span{
    height:9px;
    border-radius:999px;
    background:linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    background-size:200% 100%;
    animation:skeleton 1.4s linear infinite;
}

.skeleton-lines span:nth-child(2){ width:78%; }
.skeleton-lines span:nth-child(3){ width:58%; }

/* Input */
.input-area{
    position:fixed;
    left:var(--sidebar);
    right:0;
    bottom:0;
    z-index:10;
    padding:18px 24px 22px;
    background:linear-gradient(180deg, transparent, rgba(7,10,20,0.82) 28%, rgba(7,10,20,0.96));
    pointer-events:none;
}

.input-wrapper{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    max-width:920px;
    min-height:60px;
    margin:0 auto;
    padding:8px;
    border-radius:18px;
    background:rgba(14,20,36,0.84);
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:0 12px 36px rgba(0,0,0,0.40);
    backdrop-filter:blur(14px);
    pointer-events:auto;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-wrapper:focus-within{
    border-color:rgba(74,144,226,0.35);
    box-shadow:0 12px 36px rgba(0,0,0,0.40), 0 0 0 3px rgba(74,144,226,0.08);
}

.input-icon{
    width:34px;
    height:34px;
    margin-left:6px;
    display:grid;
    place-items:center;
    border-radius:9px;
    background:rgba(110,197,224,0.06);
    color:var(--accent);
    flex-shrink:0;
}

.input-icon svg{
    width:15px;
    height:15px;
}

.query-input{
    flex:1;
    min-width:0;
    height:44px;
    padding:0 8px;
    color:white;
    caret-color:var(--accent);
    background:transparent;
    border:0;
    outline:none;
    font-size:14.5px;
}

.query-input::placeholder{
    color:var(--muted-2);
}

.send-btn{
    position:relative;
    display:grid;
    place-items:center;
    width:44px;
    height:44px;
    flex:0 0 auto;
    border-radius:13px;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg, var(--primary), var(--violet));
    box-shadow:0 4px 14px rgba(74,144,226,0.30);
    transition:transform 0.2s ease, box-shadow 0.2s ease;
}

.send-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(74,144,226,0.40);
}

.send-btn:active{
    transform:translateY(0);
}

.send-btn svg{
    width:17px;
    height:17px;
}

.input-hint{
    position:absolute;
    left:18px;
    bottom:-20px;
    color:var(--muted-2);
    font-size:10.5px;
    display:flex;
    align-items:center;
    gap:6px;
}

.input-hint kbd{
    display:inline-block;
    padding:1px 5px;
    border-radius:4px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.10);
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    color:var(--soft);
}

.input-counter{
    position:absolute;
    right:72px;
    bottom:-20px;
    color:var(--muted-2);
    font-size:10.5px;
    font-family:'JetBrains Mono', monospace;
}

.input-counter.warn{
    color:var(--warn);
}

.mobile-scrim{
    display:none;
}

/* Toast */
.toast-container{
    position:fixed;
    bottom:100px;
    right:24px;
    z-index:100;
    display:flex;
    flex-direction:column;
    gap:8px;
    pointer-events:none;
}

.toast{
    padding:10px 14px;
    border-radius:11px;
    background:rgba(14,20,36,0.96);
    border:1px solid rgba(110,197,224,0.25);
    color:white;
    font-size:12.5px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(14px);
    animation:toastIn 0.3s ease forwards;
    display:flex;
    align-items:center;
    gap:9px;
    pointer-events:auto;
}

.toast.success{
    border-color:rgba(74,222,128,0.30);
}

.toast.error{
    border-color:rgba(232,93,117,0.30);
}

.toast svg{
    width:14px;
    height:14px;
    color:var(--accent);
}

.toast.success svg{ color:var(--green); }
.toast.error svg{ color:var(--danger); }

/* Animations - reduced count */
@keyframes fadeIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
}

@keyframes messageReveal{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
}

@keyframes caretBlink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0; }
}

@keyframes dotPulse{
    0%,100%{ transform:scale(0.7); opacity:0.4; }
    50%{ transform:scale(1); opacity:1; }
}

@keyframes skeleton{
    from{ background-position:200% 0; }
    to{ background-position:-200% 0; }
}

@keyframes livePulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.5; }
}

@keyframes stepEnter{
    to{ opacity:1; transform:translateX(0); }
}

@keyframes toastIn{
    from{ opacity:0; transform:translateX(16px); }
    to{ opacity:1; transform:translateX(0); }
}

@media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:0.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:0.001ms !important;
    }
}

function useSuggestedPrompt(query){
    const inputBox = document.getElementById('query');
    inputBox.value = query;
    inputBox.focus();
    updateCounter();
    sendQuery();
}

function applyFeatureSettings(settings){
    featureSettings = {
        enable_laqa: Boolean(settings.enable_laqa),
        enable_mrl: Boolean(settings.enable_mrl)
    };

    const laqaToggle = document.getElementById('toggleLaqa');
    const mrlToggle = document.getElementById('toggleMrl');

    if(laqaToggle){
        laqaToggle.checked = featureSettings.enable_laqa;
    }

    if(mrlToggle){
        mrlToggle.checked = featureSettings.enable_mrl;
    }
}

async function loadFeatureSettings(){
    try{
        const response = await fetch(`${API_BASE_URL}/settings`);
        if(!response.ok) throw new Error('Settings request failed');
        const data = await response.json();
        applyFeatureSettings(data);
    }catch(error){
        console.log(error);
        showToast('Could not load feature settings', 'error');
    }
}

async function updateFeatureSettings(){
    const laqaToggle = document.getElementById('toggleLaqa');
    const mrlToggle = document.getElementById('toggleMrl');
    const previousMrl = featureSettings.enable_mrl;

    const payload = {
        enable_laqa: Boolean(laqaToggle && laqaToggle.checked),
        enable_mrl: Boolean(mrlToggle && mrlToggle.checked)
    };

    [laqaToggle, mrlToggle].forEach(toggle => {
        if(toggle) toggle.disabled = true;
    });

    try{
        const response = await fetch(
            `${API_BASE_URL}/settings/update`,
            {
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify(payload)
            }
        );

        const data = await response.json();

        if(!response.ok){
            throw new Error(data.error || 'Settings update failed');
        }

        applyFeatureSettings(data);
        showToast('Feature settings updated', 'success');

        if(previousMrl !== data.enable_mrl){
            showToast('Switching retrieval database...', 'info');
        }

    }catch(error){
        console.log(error);
        applyFeatureSettings(featureSettings);
        showToast('Could not update feature settings', 'error');
    }finally{
        [laqaToggle, mrlToggle].forEach(toggle => {
            if(toggle) toggle.disabled = false;
        });
    }
}

async function sendQuery(){
    const inputBox = document.getElementById('query');
    const sendButton = document.querySelector('.send-btn');
    const query = inputBox.value.trim();

    if(!query) return;

    inputBox.disabled = true;
    sendButton.disabled = true;
    inputBox.style.opacity = "0.62";
    sendButton.style.opacity = "0.72";

    const chatWrapper = document.getElementById('chatWrapper');

    if(chatWrapper.querySelector('.hero')){
        chatWrapper.innerHTML = '';
    }

    chatWrapper.insertAdjacentHTML('beforeend', createUserMessage(query));
    chatWrapper.insertAdjacentHTML('beforeend', createThinkingMessage());

    inputBox.value = '';
    updateCounter();
    scrollBottom();

    animateThinkingSteps();

    try{
        const response = await fetch(
            `${API_BASE_URL}/query`,
            {
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({ query })
            }
        );

        const data = await response.json();
        const thinking = document.getElementById('ai-thinking');

        if(thinking){
            thinking.remove();
        }

        chatWrapper.insertAdjacentHTML('beforeend', createAIMessage(data));
        saveRecentChat(query,data);
        scrollBottom();
        animateLatestMessage(data);

    }catch(error){
        console.log(error);
        const thinking = document.getElementById('ai-thinking');

        if(thinking){
            thinking.remove();
        }

        chatWrapper.insertAdjacentHTML('beforeend', createErrorMessage());
        showToast('Failed to reach backend', 'error');
        scrollBottom();

    }finally{
        inputBox.disabled = false;
        sendButton.disabled = false;
        inputBox.style.opacity = "1";
        sendButton.style.opacity = "1";
        inputBox.focus();
    }
}

function animateThinkingSteps(){
    setTimeout(() => {
        const step1 = document.querySelector('#ai-thinking .thinking-step:nth-child(1)');
        if(step1){
            step1.classList.remove('active');
            step1.classList.add('done');
        }
        const step2 = document.querySelector('#ai-thinking .thinking-step:nth-child(2)');
        if(step2) step2.classList.add('active');
    }, 700);

    setTimeout(() => {
        const step2 = document.querySelector('#ai-thinking .thinking-step:nth-child(2)');
        if(step2){
            step2.classList.remove('active');
            step2.classList.add('done');
        }
        const step3 = document.querySelector('#ai-thinking .thinking-step:nth-child(3)');
        if(step3) step3.classList.add('active');
    }, 1400);

    setTimeout(() => {
        const step3 = document.querySelector('#ai-thinking .thinking-step:nth-child(3)');
        if(step3){
            step3.classList.remove('active');
            step3.classList.add('done');
        }
        const step4 = document.querySelector('#ai-thinking .thinking-step:nth-child(4)');
        if(step4) step4.classList.add('active');
    }, 2100);
}

function animateLatestMessage(data){
    const latestAnswer = document.querySelectorAll('.typed-answer');
    const last = latestAnswer[latestAnswer.length - 1];

    if(!last) return;

    typeText(
        data.answer || '',
        last.id,
        () => {
            const latestReasoning = document.querySelectorAll('.reasoning-box');
            const latestReasoningText = document.querySelectorAll('.reasoning-text-typed');
            const latestBottom = document.querySelectorAll('.bottom-section');
            const reasoningBox = latestReasoning[latestReasoning.length - 1];
            const reasoningText = latestReasoningText[latestReasoningText.length - 1];
            const bottomSection = latestBottom[latestBottom.length - 1];

            if(reasoningBox){
                reasoningBox.classList.add('show');
            }

            if(reasoningText){
                typeText(
                    data.reasoning || 'Reasoning was not returned by the backend.',
                    reasoningText.id,
                    () => {
                        if(bottomSection){
                            bottomSection.classList.add('show');
                            requestAnimationFrame(() => animateConfidence(bottomSection));
                        }
                    }
                );
            } else if(bottomSection){
                bottomSection.classList.add('show');
                requestAnimationFrame(() => animateConfidence(bottomSection));
            }
        }
    );
}

function createAIMessage(data){
    const unique = `${Date.now()}-${messageCounter++}`;
    const confidence = normalizeConfidence(data.confidence);
    const sources = data.source_texts || data.sources;
    const confPct = confidence * 100;

    let confClass = 'high';
    let confTier = 'High Confidence';
    if(confPct < 50){
        confClass = 'low';
        confTier = 'Low Confidence';
    } else if(confPct < 75){
        confClass = 'med';
        confTier = 'Moderate Confidence';
    }

    // Gauge math: circumference = 2 * PI * r (r=54) ≈ 339.29
    const circumference = 339.29;
    const offset = circumference - (confidence * circumference);

    return `
        <div class="message-row ai">
            <div class="avatar">AI</div>
            <div class="message-content">
                <div class="message-title">
                    Medical Assistant
                    <span class="title-badge">RAG Response</span>
                </div>

                <div class="answer-text typed-answer typing-caret" id="typed-answer-${unique}"></div>

                <div class="reasoning-box" id="reasoning-box-${unique}">
                    <button class="reasoning-toggle" type="button" onclick="toggleReasoning(this)">
                        <div class="reasoning-toggle-left">
                            <div class="reasoning-toggle-icon">
                                <svg viewBox="0 0 24 24" fill="none"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </div>
                            <div class="reasoning-toggle-label">
                                <strong>Reasoning Trace</strong>
                                <span>Explainability Layer</span>
                            </div>
                        </div>
                        <div class="reasoning-chevron">
                            <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                    </button>
                    <div class="reasoning-body">
                        <div class="reasoning-body-inner">
                            <div class="reasoning-inner">
                                <div class="reasoning-text reasoning-text-typed typing-caret" id="typed-reasoning-${unique}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bottom-section" id="bottom-section-${unique}">
                    <div class="bottom-grid">
                        <div class="confidence-box">
                            <div class="confidence-header">
                                <svg viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                Confidence
                            </div>
                            <div class="gauge-wrap">
                                <svg class="gauge-svg" viewBox="0 0 120 120">
                                    <circle class="gauge-track" cx="60" cy="60" r="54"/>
                                    <circle class="gauge-fill ${confClass}" cx="60" cy="60" r="54"
                                        stroke-dasharray="${circumference}"
                                        stroke-dashoffset="${circumference}"
                                        data-offset="${offset}"/>
                                </svg>
                                <div class="gauge-center">
                                    <div class="gauge-value ${confClass}">${confPct.toFixed(0)}<span style="font-size:14px;opacity:0.7">%</span></div>
                                    <div class="gauge-label">Score</div>
                                </div>
                            </div>
                            <div class="confidence-meta">
                                <span class="confidence-tier ${confClass}">${confTier}</span>
                                <div class="confidence-note">
                                    Calibrated from retrieval quality, grounding, and answer relevance.
                                </div>
                            </div>
                        </div>

                        <div class="sources-shell">
                            <button class="sources-btn" type="button" onclick="toggleSources(this)">
                                <span class="src-label">
                                    <svg viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    Retrieved Evidence
                                    <span class="src-count">${(sources && sources.length) || 0}</span>
                                </span>
                                <span class="source-chevron">
                                    <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </span>
                            </button>

                            <div class="sources-container">
                                <div class="sources-list">
                                    ${formatSources(sources)}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="message-actions">
                        <button class="msg-action" type="button" onclick="copyAnswer(this, 'typed-answer-${unique}')">
                            <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2"/></svg>
                            Copy
                        </button>
                        <button class="msg-action" type="button" onclick="regenerateAnswer()">
                            <svg viewBox="0 0 24 24" fill="none"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3zM7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            Helpful
                        </button>
                        <button class="msg-action" type="button" onclick="shareAnswer()">
                            <svg viewBox="0 0 24 24" fill="none"><circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98" stroke="currentColor" stroke-width="2"/></svg>
                            Share
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function toggleReasoning(btn){
    const box = btn.parentElement;
    const body = box.querySelector('.reasoning-body');
    const chev = btn.querySelector('.reasoning-chevron');
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    chev.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
}

function copyAnswer(btn, id){
    const el = document.getElementById(id);
    if(!el) return;
    const text = el.innerText;
    navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        const original = btn.innerHTML;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Copied`;
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = original;
        }, 1800);
    });
}

function regenerateAnswer(){
    showToast('Thanks for the feedback', 'success');
}

function shareAnswer(){
    showToast('Link copied to clipboard', 'success');
}

function showToast(message, type = 'info'){
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;

    let icon = '';
    if(type === 'success'){
        icon = '<svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    } else if(type === 'error'){
        icon = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M15 9l-6 6M9 9l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    } else {
        icon = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    }

    toast.innerHTML = `${icon}<span>${escapeHTML(message)}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(16px)';
        setTimeout(() => toast.remove(), 300);
    }, 2500);
}

function saveRecentChat(query,response){
    if(!currentChatId){
        currentChatId = 'chat_' + Date.now();
        allChats[currentChatId] = {
            title: query,
            messages:[]
        };
    }

    allChats[currentChatId].messages.push({
        query,
        response
    });

    sessionStorage.setItem(
        'all_medical_chats',
        JSON.stringify(allChats)
    );

    loadChats();
}

function loadChats(){
    const container = document.querySelector('.chat-history');

    allChats = JSON.parse(
        sessionStorage.getItem('all_medical_chats') || '{}'
    );

    container.innerHTML = '';

    const keys = Object.keys(allChats).reverse();
    document.getElementById('chatCount').textContent = keys.length;

    if(keys.length === 0){
        container.innerHTML = `
            <div class="history-empty">
                <svg viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Your conversations will<br>appear here.
            </div>
        `;
        return;
    }

    keys.forEach(chatId => {
        const chat = allChats[chatId];
        const active = chatId === currentChatId ? 'active' : '';

        container.insertAdjacentHTML('beforeend', `
            <div class="history-item ${active}" onclick="openRecentChat('${chatId}')" data-title="${escapeAttribute(chat.title.toLowerCase())}">
                ${escapeHTML(chat.title)}
                <span class="history-delete" onclick="event.stopPropagation(); deleteChat('${chatId}')" title="Delete">
                    <svg viewBox="0 0 24 24" fill="none" style="width:11px;height:11px"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                </span>
            </div>
        `);
    });
}

function deleteChat(chatId){
    delete allChats[chatId];
    sessionStorage.setItem('all_medical_chats', JSON.stringify(allChats));
    if(currentChatId === chatId){
        currentChatId = null;
        showHero();
    }
    loadChats();
    showToast('Conversation deleted', 'success');
}

function clearAllChats(){
    if(Object.keys(allChats).length === 0){
        showToast('No chats to clear', 'info');
        return;
    }
    if(confirm('Clear all conversations? This cannot be undone.')){
        allChats = {};
        sessionStorage.removeItem('all_medical_chats');
        currentChatId = null;
        loadChats();
        showHero();
        showToast('All conversations cleared', 'success');
    }
}

function filterHistory(){
    const search = document.getElementById('historySearch').value.toLowerCase();
    const items = document.querySelectorAll('.history-item');
    items.forEach(item => {
        const title = item.dataset.title || '';
        item.style.display = title.includes(search) ? '' : 'none';
    });
}

function openRecentChat(chatId){
    const chats = JSON.parse(
        sessionStorage.getItem('all_medical_chats') || '{}'
    );

    const chat = chats[chatId];
    if(!chat) return;

    currentChatId = chatId;
    allChats = chats;
    loadChats();
    closeSidebar();

    const chatWrapper = document.getElementById('chatWrapper');
    chatWrapper.innerHTML = '';

    chat.messages.forEach(msg => {
        chatWrapper.insertAdjacentHTML('beforeend', createUserMessage(msg.query));
        chatWrapper.insertAdjacentHTML('beforeend', createAIMessage(msg.response));
    });

    const typedAnswers = document.querySelectorAll('.typed-answer');
    const reasoningBoxes = document.querySelectorAll('.reasoning-box');
    const reasoningTexts = document.querySelectorAll('.reasoning-text-typed');
    const bottomSections = document.querySelectorAll('.bottom-section');

    chat.messages.forEach((msg,index) => {
        if(typedAnswers[index]){
            typedAnswers[index].classList.remove('typing-caret');
            typedAnswers[index].innerHTML = renderMarkdown(msg.response.answer || '', true);
        }

        if(reasoningBoxes[index]){
            reasoningBoxes[index].classList.add('show');
        }
        if(reasoningTexts[index]){
            reasoningTexts[index].classList.remove('typing-caret');
            reasoningTexts[index].innerHTML = renderMarkdown(msg.response.reasoning || 'Reasoning was not returned by the backend.', true);
        }

        if(bottomSections[index]){
            bottomSections[index].classList.add('show');
            animateConfidence(bottomSections[index]);
        }
    });

    scrollBottom();
}

function typeText(text,id,callback){
    const element = document.getElementById(id);
    if(!element) return;

    let i = 0;
    let raw = '';
    const safeText = String(text || '');

    element.innerHTML = '';
    element.classList.add('typing-caret');

    function typing(){
        if(i < safeText.length){
            // Type 3 chars per tick for smoother performance
            const chunk = Math.min(3, safeText.length - i);
            raw += safeText.substr(i, chunk);
            element.innerHTML = renderMarkdown(raw, true);
            i += chunk;
            scrollBottom();
            setTimeout(typing, 10);
        }
        else{
            element.classList.remove('typing-caret');
            element.innerHTML = renderMarkdown(safeText, true);
            if(callback) callback();
        }
    }

    typing();
}

function toggleSources(button){
    const container = button.nextElementSibling;
    const chevron = button.querySelector('.source-chevron');
    const isOpen = container.classList.contains('open');

    container.classList.toggle('open', !isOpen);
    chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
}

function formatSources(sources){
    if(!sources || sources.length === 0){
        return `
            <div class="source-card">
                <div class="source-text">No sources available.</div>
            </div>
        `;
    }

    // Generate fake relevance scores for premium feel (decreasing by rank)
    return sources.map((source, index) => {
        const relevance = Math.max(72, 96 - (index * 6));
        const evidenceLevel = index === 0 ? 'Primary' : index === 1 ? 'Secondary' : 'Supporting';
        return `
            <div class="source-card">
                <div class="source-card-head">
                    <div class="source-rank">
                        <span class="rank-badge">#${index + 1}</span>
                        <span class="source-title">${evidenceLevel} Evidence</span>
                    </div>
                    <div class="evidence-chips">
                        <span class="evidence-chip relevance">
                            <svg viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
                            ${relevance}% match
                        </span>
                        <span class="evidence-chip evidence">
                            <svg viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            Retrieved
                        </span>
                    </div>
                </div>
                <div class="source-text">${renderMarkdown(String(source), true)}</div>
            </div>
        `;
    }).join('');
}

function scrollBottom(){
    const area = document.getElementById('chatArea');
    area.scrollTo({
        top: area.scrollHeight,
        behavior: 'smooth'
    });
}

function scrollToTop(){
    const area = document.getElementById('chatArea');
    area.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

function animateConfidence(scope){
    const gaugeFill = scope.querySelector('.gauge-fill');
    if(!gaugeFill) return;

    const targetOffset = Number(gaugeFill.dataset.offset || 339.29);
    // Start from full offset (empty) then animate to target
    gaugeFill.style.strokeDashoffset = '339.29';
    requestAnimationFrame(() => {
        setTimeout(() => {
            gaugeFill.style.strokeDashoffset = targetOffset;
        }, 60);
    });
}

function normalizeConfidence(confidence){
    const value = Number(confidence);
    if(Number.isNaN(value)) return 0;
    return Math.max(0, Math.min(value, 1));
}

// Medical term highlighting
function highlightMedicalTerms(html){
    if(!html) return html;
    // Sort terms longest first to avoid partial overlap
    const sorted = [...MEDICAL_TERMS].sort((a,b) => b.length - a.length);
    sorted.forEach(term => {
        const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(?<![\\w>])(${escaped})(?![\\w<])`, 'gi');
        html = html.replace(regex, (match, p1, offset, str) => {
            // Avoid double-wrapping inside existing tags
            const before = str.lastIndexOf('<', offset);
            const closeBefore = str.lastIndexOf('>', offset);
            if(before > closeBefore) return match;
            return `<span class="med-term" title="Medical term">${p1}</span>`;
        });
    });
    return html;
}

function renderMarkdown(text, highlightTerms){
    let safe = escapeHTML(String(text || ''));

    safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');

    const lines = safe.split(/\n/);
    let output = '';
    let inList = false;

    lines.forEach(line => {
        const bullet = line.match(/^\s*[-*]\s+(.*)$/);
        const numbered = line.match(/^\s*\d+[\.)]\s+(.*)$/);

        if(bullet || numbered){
            if(!inList){
                output += '<ul>';
                inList = true;
            }
            output += `<li>${bullet ? bullet[1] : numbered[1]}</li>`;
        }
        else{
            if(inList){
                output += '</ul>';
                inList = false;
            }
            if(line.trim()){
                output += `<p>${line}</p>`;
            }
        }
    });

    if(inList){
        output += '</ul>';
    }

    if(highlightTerms){
        output = highlightMedicalTerms(output);
    }

    return output || '';
}

function escapeHTML(value){
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function escapeAttribute(value){
    return escapeHTML(value).replace(/`/g, '&#096;');
}

function handleInputKey(event){
    if(event.key === 'Enter' && !event.shiftKey){
        event.preventDefault();
        sendQuery();
    }
}

function updateCounter(){
    const input = document.getElementById('query');
    const counter = document.getElementById('inputCounter');
    const len = input.value.length;
    counter.textContent = `${len} / 500`;
    counter.classList.toggle('warn', len > 450);
}

function toggleSidebar(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('mobileScrim').classList.toggle('show');
}

function closeSidebar(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('mobileScrim').classList.remove('show');
}

// Lightly throttled mouse glow - subtle, performant
let mouseGlowFrame = null;
let lastMouseUpdate = 0;
function initMouseGlow(){
    window.addEventListener('mousemove', event => {
        const now = performance.now();
        if(now - lastMouseUpdate < 50) return; // throttle to ~20fps
        if(mouseGlowFrame) return;
        mouseGlowFrame = requestAnimationFrame(() => {
            const x = (event.clientX / window.innerWidth) * 100;
            const y = (event.clientY / window.innerHeight) * 100;
            document.documentElement.style.setProperty('--glow-x', `${x}%`);
            document.documentElement.style.setProperty('--glow-y', `${y}%`);
            mouseGlowFrame = null;
            lastMouseUpdate = now;
        });
    }, { passive:true });
}
