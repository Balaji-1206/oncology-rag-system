name: Oncology Agentic RAG CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements-prod.txt

    - name: Run Production Security Test Suite
      run: |
        python -m pytest backend/tests/test_production_security.py -v

    - name: Run Clinical Safety & Negation Guardrail Tests
      run: |
        python -m pytest backend/tests/test_clinical_guardrails.py -v

    - name: Run Production API & Deep Health Tests
      run: |
        python -m pytest backend/tests/test_production_api.py -v
