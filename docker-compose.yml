version: '3.8'

services:
  rag-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oncology-rag-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_ENABLED=false
      - OLLAMA_URL=http://ollama:11434/api/generate
      - ACTIVE_DATABASE=mrl
      - ENABLE_MRL=true
      - ENABLE_RAG=true
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/database:/app/database
      - ./backend/data:/app/data
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: oncology-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

volumes:
  ollama_storage:
    driver: local
